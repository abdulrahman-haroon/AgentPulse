name: Feature idea
description: Suggest something AgentPulse could do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation you're in, not just the feature.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like AgentPulse to do?
