[package]
name = "agentpulse"
version = "0.1.0"
description = "Tray app for AI coding agents: usage stats and task-done notifications"
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix avoids a lib/bin name clash on Windows (rust-lang/cargo#8519).
name = "agentpulse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
# Signed updates from GitHub Releases (minisign signature checked against the pubkey in tauri.conf.json).
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order: rewriting the user's settings.json must not reorder their keys.
serde_json = { version = "1", features = ["preserve_order"] }
# Dates/times; local-timezone day boundaries for "today" stats (handles DST correctly).
jiff = "1"

# Dependencies (serde_json does the heavy log parsing) are optimized even in dev builds,
# so the first parse of a large log history isn't painfully slow while developing.
[profile.dev.package."*"]
opt-level = 3

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
